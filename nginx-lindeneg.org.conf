# after updating the config, check it and reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
server {
        server_name christian.lindeneg.org lindeneg.org www.lindeneg.org;

        # the app accepts images up to 10MB; nginx rejects bodies over 1MB by default
        client_max_body_size 12m;

        location /  {
                proxy_pass http://localhost:9991;
                # the client ip for the app's rate limits (TRUST_PROXY=loopback in .env.prod)
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/christian.lindeneg.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/christian.lindeneg.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = lindeneg.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.lindeneg.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = christian.lindeneg.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        server_name christian.lindeneg.org lindeneg.org www.lindeneg.org;
    listen 80;
    return 404; # managed by Certbot






}
